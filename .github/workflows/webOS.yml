name: Build - webOS
on: [push, pull_request]
env:
  app_id: vfs.rar

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "GCC build"
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake
    - name: Download webOS NDK
      uses: robinraju/release-downloader@v1.11
      with:
        repository: "openlgtv/buildroot-nc4"
        latest: true
        fileName: "arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz"
        out-file-path: "/tmp"
    - name: Extract webOS NDK
      shell: bash
      working-directory: /tmp
      run: |
        tar xzf arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
        ./arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh
    - name: Checkout Kodi repo
      uses: actions/checkout@v5
      with:
        repository: xbmc/xbmc
        ref: master
        path: xbmc
    - name: Bootstrap depends
      run: |
        cd xbmc/tools/depends
        ./bootstrap
        ./configure --prefix=${{ github.workspace }}/xbmc-deps \
                    --with-toolchain=/tmp/arm-webos-linux-gnueabi_sdk-buildroot --host=arm-webos-linux-gnueabi \
                    --with-platform=webos --enable-debug=no
    - name: Checkout add-on repo
      uses: actions/checkout@v5
      with:
        path: ${{ env.app_id }}
    - name: Prepare
      run: |
        mkdir -p ${{ github.workspace }}/xbmc/cmake/addons/addons/${app_id}
        echo ${app_id} ${{ github.workspace }}/${app_id} > ${{ github.workspace }}/xbmc/cmake/addons/addons/${app_id}/${app_id}.txt
    - name: Configure
      run: |
        . /tmp/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup
        /usr/bin/cmake \
          -B ${app_id}/build \
          -DADDONS_TO_BUILD=${app_id} \
          -DADDON_SRC_PREFIX=${{ github.workspace }} \
          -DADDONS_DEFINITION_DIR=${{ github.workspace }}/xbmc/cmake/addons/addons \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/xbmc-deps/arm-webos-linux-gnueabi-release/share/Toolchain_binaddons.cmake \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/xbmc/addons \
          -DPACKAGE_ZIP=1 \
          ${{ github.workspace }}/xbmc/cmake/addons
    - name: Build
      env:
        CC: ${{ matrix.CC }}
        CXX: ${{ matrix.CXX }}
      run: |
        make -C ${app_id}/build -j$(getconf _NPROCESSORS_ONLN)
